<!doctype html>
<html lang="uz" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Sahifa topilmadi | Sunnatilla Sharipov</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#080A0A" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #080A0A;
        color: #F3F4F0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 480px;
        padding: 2.5rem 2rem;
        background: #101413;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1rem;
      }
      .code {
        font-family: monospace;
        font-size: 4rem;
        font-weight: 800;
        color: #00F5A0;
        letter-spacing: -2px;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
      }
      p {
        color: #A3AAA5;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-block;
        padding: 0.85rem 1.75rem;
        background-color: #00F5A0;
        color: #080A0A;
        font-weight: 600;
        font-family: monospace;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-decoration: none;
        border-radius: 0.5rem;
        transition: transform 0.2s, background-color 0.2s;
      }
      .btn:hover {
        background-color: #82FCD0;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Sahifa topilmadi // Page Not Found</h1>
      <p>
        Siz qidirayotgan sahifa mavjud emas yoki boshqa manzilga ko'chirilgan.
        <br />
        The page you are looking for does not exist or has been moved.
      </p>
      <a href="/" class="btn">Bosh sahifaga qaytish &rarr;</a>
    </div>
  </body>
</html>
